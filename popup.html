<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>리디 검색 도우미</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="title">리디 검색 도우미</div>
      <label class="toggle">
        <input id="enabledToggle" type="checkbox" disabled />
        <span class="toggleText">도우미 켜기</span>
      </label>
    </header>
    <section class="section">
      <label class="toggle">
        <input id="modeToggle" type="checkbox" disabled />
        <span class="toggleText">제외 모드</span>
      </label>
      <p class="desc">켜 두고 태그를 누르면 제외 목록에 들어가요.</p>
    </section>
    <p id="summary" class="summary" aria-live="polite">제외 태그를 넣으면 여기서 결과가 걸러져요.</p>
    <section class="section">
      <h3 class="sectionTitle">포함 태그</h3>
      <div id="includedList" class="chips"></div>
    </section>
    <section class="section">
      <div class="sectionHeaderRow">
        <h3 class="sectionTitle">제외 태그</h3>
        <button id="clearExcluded" class="danger smallBtn" title="제외 태그 전체 삭제" disabled>전체 삭제</button>
      </div>
      <div id="excludedList" class="chips"></div>
    </section>
    <footer class="footer">
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
